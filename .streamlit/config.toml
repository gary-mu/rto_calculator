# Hallmark theme: Dose. These hex values mirror the tokens in theme/tokens.css.
[theme]
base = "light"
primaryColor = "#007948"
backgroundColor = "#faf7ef"
secondaryBackgroundColor = "#e9f8ef"
textColor = "#0c1c16"
linkColor = "#007948"
borderColor = "#54655d"
font = "'Instrument Sans', ui-sans-serif, sans-serif"
headingFont = "'Schibsted Grotesk', ui-sans-serif, sans-serif"
codeFont = "'DM Mono', ui-monospace, monospace"
baseFontSize = 16
baseRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#e9f8ef"
secondaryBackgroundColor = "#faf7ef"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
